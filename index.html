<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exposición con Realidad Aumentada</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #registro {
      position: fixed; inset: 0; z-index: 9999;
      background: #1a1a2e; color: #fff;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 20px; box-sizing: border-box; overflow-y: auto;
    }
    #registro h1 { font-size: 22px; text-align: center; margin-bottom: 10px; }
    #registro input[type="text"] {
      width: 100%; max-width: 350px; padding: 12px;
      margin: 8px 0; border: none; border-radius: 8px; font-size: 16px;
      box-sizing: border-box;
    }
    #aviso {
      max-width: 350px; font-size: 13px; color: #bbb;
      background: #16213e; padding: 12px; border-radius: 8px; margin: 10px 0;
      line-height: 1.4;
    }
    .check-linea { max-width: 350px; display: flex; align-items: flex-start; gap: 8px; font-size: 13px; }
    #btnEntrar {
      width: 100%; max-width: 350px; padding: 14px;
      margin-top: 15px; border: none; border-radius: 8px;
      background: #e94560; color: #fff; font-size: 17px; font-weight: bold; cursor: pointer;
    }
    #btnEntrar:disabled { background: #555; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- ===================== PANTALLA DE REGISTRO ===================== -->
  <div id="registro">
    <h1>📸 Registro de Asistencia<br>Exposición Fotográfica</h1>
    <input type="text" id="nombre"   placeholder="Nombre completo" />
    <input type="text" id="empleado" placeholder="Número de empleado" />
    <input type="text" id="area"     placeholder="Área de adscripción" />
    <div id="aviso">
      <b>Aviso de privacidad:</b> Los datos solicitados son
      <b>meramente informativos y estadísticos</b>. No serán compartidos
      con terceros ni utilizados para ningún fin distinto al registro de
      asistencia a esta exposición.
    </div>
    <label class="check-linea">
      <input type="checkbox" id="acepto" />
      <span>He leído y acepto el aviso de privacidad.</span>
    </label>
    <button id="btnEntrar" disabled>Entrar a la experiencia AR</button>
  </div>

  <!-- ===================== ESCENA AR (oculta al inicio) ===================== -->
  <a-scene id="escenaAR"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
    color-space="sRGB" embedded
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    style="display: none;">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-assets>
      <video id="v0" src="./0.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-video src="#v0" width="1" height="0.5625" position="0 0 0"></a-video>
    </a-entity>

  </a-scene>

  <!-- ===================== LÓGICA ===================== -->
  <script>
    const URL_GUARDADO = "https://script.google.com/macros/s/AKfycbyQf0h9k1AD9HjFjatswbhZiYGnDIDL6uOKxhCXgGgGpwbmGM4OmhmVwhcXb-TyJaon/exec";

    const nombre   = document.getElementById("nombre");
    const empleado = document.getElementById("empleado");
    const area     = document.getElementById("area");
    const acepto   = document.getElementById("acepto");
    const btn      = document.getElementById("btnEntrar");
    const escena   = document.getElementById("escenaAR");

    function validar() {
      btn.disabled = !(nombre.value.trim() && empleado.value.trim()
                       && area.value.trim() && acepto.checked);
    }
    [nombre, empleado, area].forEach(el => el.addEventListener("input", validar));
    acepto.addEventListener("change", validar);

    btn.addEventListener("click", function () {
      btn.disabled = true;
      btn.textContent = "Registrando...";
      const datos = {
        nombre: nombre.value.trim(),
        empleado: empleado.value.trim(),
        area: area.value.trim()
      };
      fetch(URL_GUARDADO, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datos)
      }).finally(() => {
        iniciarAR();
      });
    });

    function iniciarAR() {
      // Oculta registro y muestra la escena
      document.getElementById("registro").style.display = "none";
      escena.style.display = "block";

      // Arranca el sistema AR manualmente (más estable)
      const sistema = escena.systems["mindar-image-system"];
      sistema.start();

      // Reproduce el video al detectar la foto
      const target = document.querySelector("[mindar-image-target]");
      const video = document.querySelector("#v0");
      target.addEventListener("targetFound", () => video.play());
      target.addEventListener("targetLost",  () => video.pause());
    }
  </script>

</body>
</html>
