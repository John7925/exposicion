<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Exposición AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; }
    #estado {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      z-index: 10000; background: rgba(0,0,0,0.7); color: #fff;
      padding: 8px 16px; border-radius: 20px; font-size: 14px;
    }
    #btnIniciar {
      position: fixed; inset: 0; z-index: 10001;
      background: #1a1a2e; color: #fff; border: none;
      font-size: 22px; font-weight: bold; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 20px; text-align: center; padding: 20px;
    }
  </style>
</head>
<body>

  <button id="btnIniciar">
    🎬<br>Toca para iniciar<br>la experiencia AR
  </button>

  <div id="estado">🔍 Apunta a una foto...</div>

  <a-scene id="escenaAR"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
    color-space="sRGB" embedded
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Los videos y targets se generan automáticamente abajo -->
    <a-assets id="assets"></a-assets>

  </a-scene>

  <script>
    // ================== CONFIGURACIÓN ==================
    const TOTAL_VIDEOS = 25;   // tus 25 videos (0.mp4 ... 24.mp4)
    // ===================================================

    const escena = document.getElementById("escenaAR");
    const estado = document.getElementById("estado");
    const btnIniciar = document.getElementById("btnIniciar");
    const assets = document.getElementById("assets");

    // Crea los videos y targets automáticamente (sin precargar todo)
    for (let i = 0; i < TOTAL_VIDEOS; i++) {
      // Video SIN preload (se carga solo cuando se necesita)
      const video = document.createElement("video");
      video.id = "v" + i;
      video.src = "./" + i + ".mp4";
      video.setAttribute("preload", "none");       // ← NO precarga (clave para 25 videos)
      video.setAttribute("loop", "");
      video.setAttribute("playsinline", "");
      video.setAttribute("webkit-playsinline", "");
      video.setAttribute("crossorigin", "anonymous");
      assets.appendChild(video);

      // Target (foto) vinculado a su video
      const target = document.createElement("a-entity");
      target.setAttribute("mindar-image-target", "targetIndex: " + i);
      const aVideo = document.createElement("a-video");
      aVideo.setAttribute("src", "#v" + i);
      aVideo.setAttribute("width", "1");
      aVideo.setAttribute("height", "0.5625");
      aVideo.setAttribute("position", "0 0 0");
      target.appendChild(aVideo);
      escena.appendChild(target);
    }

    btnIniciar.addEventListener("click", function () {
      btnIniciar.style.display = "none";
      iniciarAR();
    });

    function iniciarAR() {
      const arrancar = () => escena.systems["mindar-image-system"].start();
      if (escena.hasLoaded) arrancar();
      else escena.addEventListener("loaded", arrancar);

      const targets = document.querySelectorAll("[mindar-image-target]");
      targets.forEach((t) => {
        const sel = t.querySelector("a-video").getAttribute("src");
        const video = document.querySelector(sel);

        t.addEventListener("targetFound", () => {
          estado.textContent = "✅ ¡Foto detectada!";
          video.muted = false;
          video.play().catch(() => {
            estado.textContent = "⚠️ Toca la pantalla para el audio";
          });
        });
        t.addEventListener("targetLost", () => {
          estado.textContent = "🔍 Apunta a una foto...";
          video.pause();
        });
      });
    }
  </script>

</body>
</html>
